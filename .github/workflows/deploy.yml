name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viztto-production
  cancel-in-progress: false

jobs:
  validate:
    name: Barreira obrigatória de validação
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: npm ci

      # Ordem: build uma vez → E2E contra next start. Falha E2E bloqueia deploy.
      - run: npm run snapshots:check-git
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ratings
      - run: npm run build

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: E2E (produção local)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload artefatos Playwright (falha)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to viztto.site
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VIZTTO_DEPLOY_KEY }}" > ~/.ssh/viztto_deploy
          chmod 600 ~/.ssh/viztto_deploy
          printf '%s\n' "${{ secrets.VIZTTO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/viztto_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            kaue@20.120.1.228

      - name: Verify production URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            https://viztto.site/ >/dev/null
          echo "Production health check passed."
